# Mẫu cấu hình — copy thành `env_vars.yaml` rồi điền giá trị thật.
# Lưu ý: app.py đọc mỗi dòng theo dạng KEY: VALUE (không hỗ trợ comment cùng dòng),
# nên chỉ đặt ghi chú trên dòng riêng như file này.

SUPABASE_URL: "https://YOUR-PROJECT.supabase.co"
SUPABASE_SECRET_KEY: "sb_secret_REPLACE_ME"
SUPABASE_BUCKET: "drive"

# ===== Kho lưu trữ dài hạn (task / comment / checklist / link) =====
# Tạo DB Turso rồi dán vào đây. Xem README mục "Kho lưu trữ dài hạn".
#   turso db create vn-tracking-archive
#   turso db show vn-tracking-archive --url
#   turso db tokens create vn-tracking-archive
# Nếu để trống, app tự dùng SQLite local tại data/vn_tracking_archive.db
TURSO_DATABASE_URL: ""
TURSO_AUTH_TOKEN: ""
# Chu kỳ tự đồng bộ archive (giây), mặc định 900 = 15 phút
ARCHIVE_SYNC_INTERVAL: "900"
# Token cho endpoint cron /api/archive/cron?token=...
ARCHIVE_CRON_TOKEN: ""

SECRET_KEY: "change-me-to-a-random-string"
GROQ_API_KEY: ""
TZ: "Asia/Ho_Chi_Minh"

# Dán nguyên thẻ iframe embed lịch Google (route /calendar sẽ redirect tới src)
GOOGLE_CALENDAR_EMBED_URL: ""

# Google Apps Script Web App xử lý upload ảnh nghỉ phép, Calendar event và email
LEAVE_GDRIVE_SCRIPT_URL: ""
LEAVE_RESPONSES_SPREADSHEET_ID: ""
LEAVE_RESPONSES_SHEET_TAB: "Form Responses 1"

# ===== Task Assignee =====
# Độ khó task được đồng bộ vào DB. Mặc định 1800 giây (30 phút).
DIFFICULTY_SYNC_TTL: "1800"
# Số giờ tham chiếu mỗi người/tuần để tính cân bằng tải
ASSIGNEE_WEEK_CAPACITY_HOURS: "40"
# Nếu cột 作業者 bị Protect, deploy integrations/assign_task_webapp.gs rồi dán
# URL + token vào đây để ghi qua Apps Script (chạy dưới quyền owner).
ASSIGNEE_WRITE_URL: ""
ASSIGNEE_WRITE_TOKEN: ""

# Chỉ dùng khi chạy trên Linux và muốn mở Cloudflare Tunnel
CF_TUNNEL_TOKEN: ""
