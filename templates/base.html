<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="VN-Tracking Dashboard - Quản lý tiến độ Team Việt Nam">
    <title>{% block title %}VN-Tracking Dashboard{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Nunito:wght@700;800;900;1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v={{ range(1, 1000000) | random }}">
    <link rel="icon" href="{{ url_for('static', filename='logo.png') }}" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/vn.js"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ja.js"></script>
    <script src="{{ url_for('static', filename='js/lenis.min.js') }}"></script>
    <script>
        (function() {
            var savedTheme = localStorage.getItem('vn_tracking_theme');
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark-theme');
            }

            // Áp theme cho cả <body> (các override sáng dùng body:not(.dark-theme)).
            // Cần thiết cho trang con trong iframe (Lịch sử task, LSA Drive, PSD Tool...).
            function applyBodyTheme(isDark) {
                if (document.body) {
                    document.body.classList.toggle('dark-theme', isDark);
                }
            }
            if (document.body) {
                applyBodyTheme(savedTheme === 'dark');
            } else {
                document.addEventListener('DOMContentLoaded', function() {
                    applyBodyTheme(localStorage.getItem('vn_tracking_theme') === 'dark');
                });
            }

            // Đồng bộ theme khi trang cha (Dashboard) bật/tắt chế độ sáng-tối.
            window.addEventListener('message', function(e) {
                if (e.data && e.data.type === 'theme_change') {
                    var isDark = e.data.theme === 'dark';
                    document.documentElement.classList.toggle('dark-theme', isDark);
                    document.body.classList.toggle('dark-theme', isDark);
                }
            });
        })();
    </script>
    {% block head %}{% endblock %}
</head>
<body>
    <div id="toast-container" class="toast-container"></div>
    {% block body %}{% endblock %}
    <script>
        window.APP_VERSION = "{{ app_version or '' }}";
        window.APP_BUILD_ID = "{{ app_build_id or '' }}";
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}?v={{ range(1, 1000000) | random }}"></script>
    {% block scripts %}{% endblock %}


</body>
</html>
